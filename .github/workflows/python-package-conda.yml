name: Python Conda Package Workflow
on:
push:
branches: [ main, master ]
pull_request:
branches: [ main, master ]
workflow_dispatch:
jobs:
build-and-test:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
- name: Install Dependencies
run: |
python -m pip install --upgrade pip
pip install fastapi uvicorn pydantic
- name: Run Application Test
env:
PYTHONPATH: .
run: |
echo "Running security lab checks..."
python -c "import app; print('FastAPI app loaded successfully!')"
