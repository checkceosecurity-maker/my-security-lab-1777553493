name: Python Conda Package Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: agentos
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn pydantic; fi

      - name: Validate Python application
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q . -x 'node_modules|.git'
          if [ -f app.py ]; then python -c "import app; print('FastAPI app loaded successfully!')"; else echo 'No app.py found; static frontend validation passed.'; fi
