<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ AG2</title><style>body{font-family:system-ui;background:#0b1020;color:white;display:grid;place-items:center;min-height:100vh}.box{background:#141f39;padding:32px;border-radius:14px;width:min(380px,90%)}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border-radius:8px}input{background:#0b1020;color:white;border:1px solid #45609b}button{background:#263c73;color:white;border:0}#error{color:#ff8888}</style></head><body><div class="box"><h1>AG2 Platform</h1><form id="form"><input id="email" type="email" placeholder="Email" value="demo@ag2.local" required><input id="password" type="password" placeholder="Password" value="demo123" required><button>เข้าสู่ระบบ</button></form><p id="error"></p></div><script src="assets/config.js"></script><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{const r=await apiClient.post('/api/auth/login',{email:email.value,password:password.value});setAuthToken(r.access_token);location.href='/'}catch(x){error.textContent='เข้าสู่ระบบไม่สำเร็จ'}}</script></body></html>
